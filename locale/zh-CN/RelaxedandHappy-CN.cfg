[mod-setting-description]
builder-start=选择是否启用建筑师开局，可选是否强化个人装甲模块。
starting-robot-count=需要启用建筑师开局，建议200。
faster-robots=最大有效值为100。
robot-no-energy=彻底移除机器人的能量消耗，无需充电。
starting-items=搭配大背包使用，防止背包爆满。
adjustable-backpack-enabled=原版背包默认80格。

stack-multiplier=堆叠倍数，默认为原堆叠数。
crafting-revolution=手搓倍数。
player-mining-speed=扣矿倍数。
player-run-speed=基础移动速度倍数。
player-reach-distance=2.0版本已经不能地图拿取物品。

teleport-mode=启用传送功能，开启后可使用[color=blue]Ctrl+Shift+T[/color]或者点击快捷栏获取传送工具。
electric-pump-mode=允许抽取泵在陆地等普通地块上抽水。[color=yellow]超级模式[/color]会影响其他模组添加的抽取泵，并将抽取速度提高至 10 倍。
functional-enhancements=启用后将进行一系列优化：\n• 禁用雷达扫描图层（雷达仍可传递信号）\n• 所有矿机固有速度与产能增加 100%\n• 所有广域电线杆自带发电

processing-enhanced=[item=foundry] 支持 [item=electric-furnace] 生产配方\n[item=electromagnetic-plant] 支持 [item=centrifuge] 生产配方\n[item=cryogenic-plant] 支持 [item=chemical-plant] 和 [item=oil-refinery] 生产配方。
allow-quality-all-recipes=启用后，所有配方（包括其他模组添加的）都将允许使用品质插件。\n此选项会覆盖配方原有的品质限制，例如铀增值、星岩再处理等。
spoil-time-multiplier=调整大部分物品的变质速度（[item=iron-bacteria]、[item=copper-bacteria] 和 [item=nutrients] 以及部分细菌产品除外）。\n可调范围：0.1 ~ 10，值越大保质期越长。\n仅 [color=blue]Space Age[/color] 启用时生效。

orbital-solar-power=每次发射火箭使表面太阳能发电效率提高。
orbital-solar-scope=更改[color=red]轨道太阳能发电[/color]影响表面。
auto-report-rocket-stats=自动报告[color=blue]轨道太阳能火箭[/color]发射统计。

infinity-chest=[virtual-signal=signal-alert][color=red]开局获得部分永续箱、管道、电力接口等物品（适用于测试或在成就模式下安全启停MOD）。[/color]

custom-player-attributes=启用后可自定义玩家属性。
unimpeded=畅通无阻。
p-adjustable-backpack-enabled=仅在[color=blue]启动设置[/color]中启用[color=blue]自定义属性[/color]时生效。

electric-pole-config=修改电线杆接线范围，使[item=small-electric-pole] 与 [item=medium-electric-pole]全电力全覆盖，[item=big-electric-pole]覆盖范围翻倍。
roboport-config=统一配置原版机器人平台的物流与建筑范围。强化模式会将全部模组机器人平台的充电位、充电功率、能量缓存及输出上限提高至 10 倍，输入上限提高至 2 倍。

