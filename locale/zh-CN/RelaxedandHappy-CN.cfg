[string-mod-setting-description]
builder-start-Enabled-and-Enhance=强化个人装甲模块的部分属性。
builder-start-legendary=若启用品质系统，则开局给予传说级装备，否则无效。
starting-items-abundant=5倍普通初始物品。
electric-pole-config-5=所有电线杆范围为64，可实现完全覆盖电力网络。
electric-pump-mode-single=仅修改原版抽水泵，允许它在普通陆地上抽水。
electric-pump-mode-super=修改所有模组的抽取泵，允许随地抽水并将抽取速度提高至 10 倍。

teleport-mode-disabled=传送功能完全关闭，快捷键和快捷栏按钮均无效。
teleport-mode-current-surface=只能在当前星球表面使用传送。
teleport-mode-all-surfaces=可在任意表面传送（包括通过远程视图点击其他星球）。

