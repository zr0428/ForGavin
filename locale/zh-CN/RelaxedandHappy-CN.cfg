[mod-name]
ForGavin=快乐摸鱼[ForGavin]

[mod-description]
ForGavin=一些基础的辅助型和部分作弊模组，均可选择开启或者关闭\n含机器人开局，调整背包大小，修改堆叠大小，玩家人物属性，开局物品（含永续箱），调整电线杆范围及机器人平台范围等。\n每一发火箭均可提升该表面10%太阳能发电效率等功能\n\n支持工业革命3，k2，SE，立方体，py，nullius等，有问题联系加qq群939886893交流。

