[recipe-description]
foundry-firearm-magazine=用熔融铁水直接浇筑标准弹匣。
foundry-piercing-rounds-magazine=在标准弹匣的基础上，用熔融铁水和熔融铜水浇筑穿甲弹匣。
foundry-shotgun-shell=用熔融铁水和熔融铜水浇筑霰弹。
foundry-piercing-shotgun-shell=在霰弹的基础上，用熔融铁水和熔融铜水浇筑穿甲霰弹。
foundry-engine-unit=用熔融铁水浇筑内燃机（如原版配方有管道则保留），支持产能插件。
foundry-iron-chest=用熔融铁水浇筑铁箱。
foundry-steel-chest=用熔融铁水浇筑钢箱。
foundry-storage-tank=用熔融铁水和4根铁管浇筑储液罐。
foundry-rail=用熔融铁水和石头浇筑铁路。
foundry-refined-concrete=用熔融铁水、水和混凝土浇筑钢筋混凝土。
foundry-space-platform-foundation=用熔融铁水和熔融铜水浇筑太空平台基座。
foundry-barrel=用熔融铁水浇筑空桶。

