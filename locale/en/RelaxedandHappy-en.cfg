[mod-name]
ForGavin=Relaxed and Happy [ForGavin]

[mod-description]
ForGavin=Provides basic utility and optional cheat modules, all individually toggleable.\nIncludes robot start, adjustable backpack, stack size modification, player attributes, starting items (including infinity chest), adjustable power pole and roboport ranges, and more.\nEach rocket launch can increase solar power efficiency on that surface by 10%.\n\nSupports Industrial Revolution 3, K2, SE, Ultracube, Py, Nullius, etc. Contact: QQ group 939886893.

