[mod-setting-description]
builder-start=Enable Architect Start. Optionally enhances personal armor modules.
starting-robot-count=Requires Architect Start to be enabled. Recommended: 200.
faster-robots=Maximum effective value is 100.
robot-no-energy=Completely removes robot energy consumption – no charging needed.
starting-items=Use with a large backpack to avoid inventory overflow.
adjustable-backpack-enabled=Default vanilla backpack size is 80 slots.

stack-multiplier=Multiplier for item stack sizes. Default is vanilla stack size.
crafting-revolution=Manual crafting speed multiplier.
player-mining-speed=Mining speed multiplier.
player-run-speed=Base movement speed multiplier.
player-reach-distance=Map pickup is no longer possible in version 2.0.

teleport-mode=Enable teleporting with Ctrl+Shift+T or the shortcut bar (not available in editor mode).
electric-pump-mode=Allows offshore pumps to draw water from ordinary land tiles. [color=yellow]Super mode[/color] affects offshore pumps added by other mods and increases pumping speed to 10x.
functional-enhancements=When enabled, performs a series of optimizations:\n• Disables radar scanning (radars still transmit signals)\n• All mining drills get +100%% innate speed and productivity\n• All substations emit light on their own

processing-enhanced=[item=foundry] supports [item=electric-furnace] recipes\n[item=electromagnetic-plant] supports [item=centrifuge] recipes\n[item=cryogenic-plant] supports [item=chemical-plant] and [item=oil-refinery] recipes.
allow-quality-all-recipes=When enabled, all recipes (including those added by other mods) will accept quality modules.\nThis overrides any default quality restrictions, such as uranium enrichment and asteroid reprocessing.
spoil-time-multiplier=Adjusts the spoil speed of most items (except [item=iron-bacteria], [item=copper-bacteria], [item=nutrients] and some bacterial products).\nRange: 0.1 ~ 10, higher values increase shelf life.\nOnly effective when [color=blue]Space Age[/color] is enabled.

orbital-solar-power=Each rocket launch increases surface solar power efficiency.
orbital-solar-scope=Changes which surfaces are affected by [color=red]Orbital Solar Power[/color].
auto-report-rocket-stats=Auto report [color=blue]Orbital Solar Power[/color] launch stats.

infinity-chest=[virtual-signal=signal-alert][color=red]Start with Infinity Chest, Infinity Pipe, power interfaces, etc. (Useful for testing or toggling mods while preserving achievements).[/color]

custom-player-attributes=Enable custom player attribute configuration.
p-adjustable-backpack-enabled=Only effective when [color=blue]Custom Player Attributes[/color] is enabled in [color=blue]startup settings[/color].

electric-pole-config=Adjust wire distance and supply area so that [item=small-electric-pole] and [item=medium-electric-pole] fully cover their supply areas. [item=big-electric-pole] has doubled coverage.
roboport-config=Configures the vanilla roboport's logistics and construction ranges. Enhanced modes multiply charging stations, charging power, energy buffers, and output limits by 10 for all modded roboports; input limits are multiplied by 2.

